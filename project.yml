name: HerdrWatch
options:
  bundleIdPrefix: dev.herdr
  deploymentTarget:
    iOS: '17.0'
    macOS: '15.0'
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    revision: ae8562f895de06ccb86fdb1cbb65fd99c8976e12
  NIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
  NIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  Crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.12.3
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    PRODUCT_BUNDLE_IDENTIFIER: dev.herdr.HerdrWatch
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect securely to your paired HerdrWatch host.
targets:
  HerdrWatch:
    type: application
    platform: iOS
    sources: [HerdrWatch]
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J9RQ24X3A8
        'CODE_SIGNING_ALLOWED[sdk=iphoneos*]': YES
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the QR code printed by your HerdrWatch host companion to pair this iPhone securely.
    dependencies: &deps
      - package: Citadel
      - package: NIOSSH
      - package: NIO
      - package: Crypto
  HerdrWatchPreview:
    type: application
    platform: macOS
    sources: [HerdrWatch]
    dependencies: *deps
  HerdrWatchTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: HerdrWatchPreview
schemes:
  HerdrWatch:
    build:
      targets:
        HerdrWatch: all
  HerdrWatchPreview:
    build:
      targets:
        HerdrWatchPreview: all
    test:
      targets: [HerdrWatchTests]
