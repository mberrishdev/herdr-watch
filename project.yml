name: HerdrWatch
options:
  bundleIdPrefix: dev.herdr
  deploymentTarget:
    iOS: '17.0'
    macOS: '15.0'
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    revision: ae8562f895de06ccb86fdb1cbb65fd99c8976e12
  NIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
  NIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  Crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.12.3
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    PRODUCT_BUNDLE_IDENTIFIER: dev.herdr.HerdrWatch
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect securely to your paired HerdrWatch host.
targets:
  HerdrWatch:
    type: application
    platform: iOS
    sources: [apps/ios/HerdrWatch]
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J9RQ24X3A8
        'CODE_SIGNING_ALLOWED[sdk=iphoneos*]': YES
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the QR code printed by your HerdrWatch host companion to pair this iPhone securely.
    dependencies: &deps
      - package: Citadel
      - package: NIOSSH
      - package: NIO
      - package: Crypto
  HerdrWatchPreview:
    type: application
    platform: macOS
    sources: [apps/ios/HerdrWatch]
    dependencies: *deps
  HerdrWatchHost:
    type: application
    platform: macOS
    sources: [apps/macos-host/HerdrWatchHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdr.HerdrWatchHost
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
    postBuildScripts:
      - name: Build universal Go host companion
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/go/bin:/usr/local/bin:$PATH"
          if ! command -v go >/dev/null 2>&1; then
            echo "error: Go is required to build HerdrWatchHost. Install Go from https://go.dev/dl/ and build again."
            exit 1
          fi
          cd "$SRCROOT/services/host"
          resource_dir="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$resource_dir"
          GOOS=darwin GOARCH=arm64 go build -trimpath -o "$DERIVED_FILE_DIR/herdrwatch-host-arm64" ./cmd/herdrwatch-host
          GOOS=darwin GOARCH=amd64 go build -trimpath -o "$DERIVED_FILE_DIR/herdrwatch-host-amd64" ./cmd/herdrwatch-host
          /usr/bin/lipo -create "$DERIVED_FILE_DIR/herdrwatch-host-arm64" "$DERIVED_FILE_DIR/herdrwatch-host-amd64" -output "$resource_dir/herdrwatch-host"
          chmod 755 "$resource_dir/herdrwatch-host"
  HerdrWatchTests:
    type: bundle.unit-test
    platform: macOS
    sources: [apps/ios/Tests]
    dependencies:
      - target: HerdrWatchPreview
schemes:
  HerdrWatch:
    build:
      targets:
        HerdrWatch: all
  HerdrWatchPreview:
    build:
      targets:
        HerdrWatchPreview: all
    test:
      targets: [HerdrWatchTests]
  HerdrWatchHost:
    build:
      targets:
        HerdrWatchHost: all
