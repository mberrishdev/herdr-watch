name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal DMG
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/host/go.mod
          cache-dependency-path: services/host/go.sum
      - name: Archive the native Mac host app
        run: |
          set -euo pipefail
          MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
          CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
          xcodebuild -project HerdrWatch.xcodeproj -scheme HerdrWatchHost \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/HerdrWatchHost.xcarchive" archive \
      - name: Create DMG installer
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dmg-root" release-assets
          ditto "$RUNNER_TEMP/HerdrWatchHost.xcarchive/Products/Applications/HerdrWatchHost.app" "$RUNNER_TEMP/dmg-root/HerdrWatchHost.app"
          ln -s /Applications "$RUNNER_TEMP/dmg-root/Applications"
          hdiutil create -volname "HerdrWatch Host $VERSION" -srcfolder "$RUNNER_TEMP/dmg-root" -ov -format UDZO "release-assets/HerdrWatch-Host-macos-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/HerdrWatchHost.xcarchive/Products/Applications/HerdrWatchHost.app" "release-assets/HerdrWatch-Host-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: HerdrWatch-Host-macos-universal
          path: release-assets/*
          if-no-files-found: error

  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/host/go.mod
          cache-dependency-path: services/host/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Validate Tauri signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY is required." }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required." }
          if (-not $env:TAURI_SIGNING_PUBLIC_KEY) { throw "TAURI_SIGNING_PUBLIC_KEY is required." }
      - name: Build the Windows NSIS installer
        working-directory: apps/desktop
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $config.version = $env:VERSION.Substring(1)
          $config.bundle.createUpdaterArtifacts = $true
          $config.plugins.updater.pubkey = $env:TAURI_SIGNING_PUBLIC_KEY
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.release.conf.json"
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath
          npm run tauri:build -- --bundles nsis --config $configPath
        env:
          VERSION: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
      - name: Give the setup package a clear release name
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce an NSIS setup installer." }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item $installer.FullName "release-assets/HerdrWatch-Host-windows-x64-setup.exe"
          $updateArchive = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $signature = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig" | Select-Object -First 1
          if (-not $updateArchive -or -not $signature) { throw "Tauri updater artifacts were not produced." }
          Copy-Item $updateArchive.FullName "release-assets/HerdrWatch-Host-windows-x64-setup.exe"
          Copy-Item $signature.FullName "release-assets/HerdrWatch-Host-windows-x64-setup.exe.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: HerdrWatch-Host-windows-x64
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create Windows updater metadata
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          signature="$(cat release-assets/HerdrWatch-Host-windows-x64-setup.exe.sig)"
          jq -n \
            --arg version "$version" \
            --arg signature "$signature" \
            --arg url "https://github.com/${REPOSITORY}/releases/download/${VERSION}/HerdrWatch-Host-windows-x64-setup.exe" \
            '{version: $version, notes: "A new HerdrWatch Host release is available.", platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > release-assets/latest.json
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: HerdrWatch ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body: |
            First desktop companion release.

            - **macOS:** Universal DMG installer for Apple Silicon and Intel Macs. It contains the native HerdrWatch Host menu-bar app.
            - **Windows:** NSIS setup installer for x64 Windows. This is a complete installer, not the raw application executable.

            Windows requires OpenSSH Server and Herdr installed for the same Windows account. Windows agent-session discovery is early and still needs broader host validation.
            The installers are not code-signed or notarized; Windows SmartScreen or macOS Gatekeeper may show a first-run warning.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
